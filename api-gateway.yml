server:
 port: 8083

spring:
 application:
 name: api-gateway

 cloud:
 gateway:
 server:
 webmvc:
 routes:

 - id: product-service
 uri: lb://product-service
 predicates:
 - Path=/api/products/**

 - id: order-service
 uri: lb://order-service
 predicates:
 - Path=/api/orders/**

 - id: user-service
 uri: lb://user-service
 predicates:
 - Path=/api/users/**

eureka:
 client:
 service-url:
 defaultZone: http://localhost:8761/eureka/
